version: "3.9"
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tpmr
      POSTGRES_PASSWORD: tpmr_dev
      POSTGRES_DB: tpmr_db
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  backend:
    build:
      context: ../services/backend
      dockerfile: ../../infra/docker/backend.Dockerfile
    env_file: .env
    ports: ["8000:8000"]
    depends_on: [postgres, redis]
    volumes: ["../services/backend:/app"]

  dashboard:
    build:
      context: ../apps/dashboard
      dockerfile: ../../infra/docker/dashboard.Dockerfile
    env_file: .env
    ports: ["3000:3000"]
    depends_on: [backend]

volumes:
  pgdata:
